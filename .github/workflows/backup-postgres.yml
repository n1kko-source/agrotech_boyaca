# AG-40 — Daily Postgres dump to Cloudflare R2 (not GitHub artifacts).
# Host: Render is unrelated. DB: Supabase. Object store: same R2 bucket, prefix backups/.
name: Postgres backup

on:
  schedule:
    # 06:00 Colombia (COT = UTC−5, no DST)
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: postgres-backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  backup:
    name: Dump, restore-test, prune
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RETENTION_DAYS: '7'
      R2_PREFIX: backups/postgres
      AWS_EC2_METADATA_DISABLED: 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: agrotech_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore -d agrotech_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump to R2 and prune
        run: bash infra/backup/dump-and-upload.sh

      - name: Restore test (canary)
        env:
          RESTORE_URL: postgresql://restore:restore@127.0.0.1:5432/agrotech_restore
        run: bash infra/backup/restore-test.sh

      - name: Record success
        if: success()
        run: bash infra/backup/record-state.sh ok

      - name: Record failure and alert if consecutive
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash infra/backup/record-state.sh fail
